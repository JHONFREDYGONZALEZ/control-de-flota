<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#B45309" />
    <title>Sin conexión — Control de flota</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F6F8; color: #181B20; font-family: system-ui, sans-serif; padding: 24px; text-align: center; }
      .card { background: #fff; border: 1px solid #DFE2E7; border-radius: 10px; padding: 28px 22px; max-width: 360px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #5B6270; margin: 0 0 18px; line-height: 1.45; }
      button { background: #B45309; color: #fff; border: 0; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>Esta pantalla aún no se había guardado en el celular. Abre primero el panel principal con señal; después podrás usarla sin conexión. Lo que ya registraste se envía solo al volver la señal.</p>
      <button onclick="location.href='/dashboard'">Ir al panel</button>
    </div>
  </body>
</html>
